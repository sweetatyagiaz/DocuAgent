version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: docuagent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
      - ./app/db:/app/app/db  # persist SQLite demo DB across rebuilds
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: docuagent-frontend
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - chroma_data:/app/chroma_db
      - ./app/db:/app/app/db
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chroma_data:
    driver: local
